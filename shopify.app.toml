# Link your registered app with: shopify app config link
client_id = ""
name = "Artist Ledger"
application_url = "https://your-app.example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,read_inventory,read_orders"
optional_scopes = ["read_all_orders"]

[auth]
redirect_urls = ["https://your-app.example.com/auth/callback", "https://your-app.example.com/auth/shopify/callback"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/webhooks/privacy"
